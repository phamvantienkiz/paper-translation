<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }} - Bản dịch tiếng Việt</title>
  
  <!-- KaTeX for rendering mathematical formulas -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
          onload="renderMathInElement(document.body, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError : false
          });"></script>

  <style>
    :root {
      --bg-surface: #f4f5f7;
      --paper-bg: #ffffff;
      --text-main: #1f2328;
      --text-muted: #57606a;
      --primary: #0969da;
      --primary-hover: #0852ab;
      --border-color: #d0d7de;
      --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      --font-serif: "Times New Roman", Times, Georgia, "Cambria Math", serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-surface);
      color: var(--text-main);
      font-family: var(--font-body);
      line-height: 1.65;
      font-size: 11pt;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 0 60px 0;
    }

    /* Floating Toolbar with single Download PDF button */
    .top-action-bar {
      position: sticky;
      top: 16px;
      z-index: 1000;
      margin-bottom: 24px;
      display: flex;
      gap: 12px;
      align-items: center;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      padding: 8px 16px;
      border-radius: 9999px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
      border: 1px solid var(--border-color);
    }

    .btn-download-pdf {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 9999px;
      padding: 10px 22px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(9, 105, 218, 0.25);
      transition: all 0.2s ease;
    }

    .btn-download-pdf:hover {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 10px rgba(9, 105, 218, 0.35);
    }

    .btn-download-pdf svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    /* A4 Canvas Page Container */
    .a4-container {
      width: 210mm;
      min-height: 297mm;
      background: var(--paper-bg);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      padding: 22mm 20mm;
      margin-bottom: 24px;
      border-radius: 2px;
    }

    /* Document Typography */
    .paper-title {
      font-family: var(--font-serif);
      font-size: 20pt;
      font-weight: 700;
      text-align: center;
      line-height: 1.3;
      margin-bottom: 18px;
      color: #111827;
    }

    .paper-meta {
      text-align: center;
      font-size: 9.5pt;
      color: var(--text-muted);
      margin-bottom: 28px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-color);
    }

    .paper-content h1, .paper-content h2, .paper-content h3 {
      font-family: var(--font-serif);
      color: #111827;
      margin-top: 22px;
      margin-bottom: 10px;
      page-break-after: avoid;
    }

    .paper-content h1 {
      font-size: 15pt;
      border-bottom: 1px solid #eaecef;
      padding-bottom: 4px;
    }

    .paper-content h2 {
      font-size: 13pt;
    }

    .paper-content h3 {
      font-size: 11.5pt;
    }

    .paper-content p {
      margin-bottom: 14px;
      text-align: justify;
      hyphens: auto;
    }

    .paper-content ul, .paper-content ol {
      margin-left: 24px;
      margin-bottom: 14px;
    }

    .paper-content li {
      margin-bottom: 6px;
    }

    /* Academic Figures & Images */
    .paper-figure {
      margin: 20px auto;
      text-align: center;
      page-break-inside: avoid;
      max-width: 100%;
    }

    .paper-figure img {
      max-width: 95%;
      height: auto;
      border: 1px solid #e1e4e8;
      border-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }

    .figure-caption {
      font-size: 9pt;
      color: var(--text-muted);
      margin-top: 8px;
      font-style: italic;
    }

    /* Academic Tables (Booktabs style) */
    .paper-table-wrapper {
      margin: 20px 0;
      overflow-x: auto;
      page-break-inside: avoid;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0;
      font-size: 9.5pt;
      border-top: 2px solid #24292f;
      border-bottom: 2px solid #24292f;
    }

    th {
      border-bottom: 1px solid #24292f;
      padding: 8px 10px;
      text-align: left;
      font-weight: 600;
    }

    td {
      padding: 6px 10px;
      border-bottom: 1px solid #e1e4e8;
    }

    /* Math Formula Block */
    .katex-display {
      margin: 14px 0 !important;
      overflow-x: auto;
      overflow-y: hidden;
      page-break-inside: avoid;
    }

    /* Print Stylesheet for exact A4 PDF output */
    @media print {
      body {
        background: transparent !important;
        padding: 0 !important;
      }

      .top-action-bar {
        display: none !important;
      }

      .a4-container {
        width: 100% !important;
        min-height: auto !important;
        padding: 0 !important;
        margin: 0 !important;
        box-shadow: none !important;
        border: none !important;
      }

      @page {
        size: A4;
        margin: 18mm 16mm 18mm 16mm;
      }

      h1, h2, h3 {
        page-break-after: avoid;
      }

      .paper-figure, .paper-table-wrapper {
        page-break-inside: avoid;
      }
    }
  </style>
</head>
<body>

  <!-- Nút Tải PDF duy nhất -->
  <div class="top-action-bar">
    <button class="btn-download-pdf" onclick="window.print()" title="In hoặc Tải xuống tài liệu dưới dạng PDF">
      <svg viewBox="0 0 24 24">
        <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
      </svg>
      Tải PDF (In A4)
    </button>
  </div>

  <!-- Khung Canvas Khổ A4 -->
  <div class="a4-container">
    <h1 class="paper-title">{{ title }}</h1>
    <div class="paper-meta">
      Bản dịch học thuật Tiếng Việt &bull; Tổng hợp tự động qua Paper Translation Skill &bull; Chuẩn khổ A4
    </div>

    <div class="paper-content">
      {{ content_html | safe }}
    </div>
  </div>

</body>
</html>
